  - aid: universiti-teknologi-petronas:journal-digital-commons
    name: "Platform: A Journal of Engineering archive (bepress Digital Commons tenancy)"
    x-operator: tenant
    x-operator-evidence: >-
      journal.utp.edu.my is an institution-branded host that CNAMEs to dcutpmy.bepress.com, and the
      OAI-PMH Identify adminEmail is dc-support@elsevier.com. UTP's content and UTP's journal;
      bepress/Elsevier's software and contract.
    description: >-
      UTP's Digital Commons instance, holding the archive of "Platform: A Journal of Engineering
      (PAJE)" back to 2000. Serves OAI-PMH 2.0 at /do/oai/. Recorded as a tenancy: the repository
      and its metadata are the institution's, the platform contract belongs to bepress and is
      scored against bepress, not against UTP.
    humanURL: https://journal.utp.edu.my/
    baseURL: https://journal.utp.edu.my/do/oai/
    tags: [ Digital Commons, bepress, OAI-PMH, Scholarly Publishing, Tenant ]
    properties:
