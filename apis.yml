apis:
  - aid: universiti-teknologi-petronas:utpedia
    name: UTPedia Institutional Repository
    x-operator: institution
    x-operator-evidence: >-
      Host utpedia.utp.edu.my is under the institution's own registrable domain; OAI-PMH Identify
      names the repository "UTP Electronic and Digital Intellectual Asset" with adminEmail
      sharifah_fahimah@utp.edu.my. Self-hosted EPrints 3.4.7, no vendor host in the path.
    description: >-
      UTPedia ("UTP Electronic and Digital Intellectual Asset") holds theses, dissertations and
      final-year projects. It serves an open OAI-PMH 2.0 endpoint (formats oai_dc, mets, didl, rdf,
      oai_bibl, uketd_dc), an unauthenticated EPrints REST interface over the eprint, subject and
      user datasets, per-record JSON export, an OpenSearch 1.1 description document and an RSS 2.0
      feed of recent deposits. Earliest datestamp 2012-01-18. Deposit over SWORD is credentialed.
    humanURL: https://utpedia.utp.edu.my/
    baseURL: https://utpedia.utp.edu.my
    tags: [ Institutional Repository, OAI-PMH, EPrints, Open Access, Research, Metadata ]
    properties:
