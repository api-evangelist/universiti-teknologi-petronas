description: >-
  Universiti Teknologi PETRONAS (UTP) is a private research university in Seri Iskandar, Perak,
  Malaysia, established in 1997 and wholly owned by the national oil company PETRONAS. UTP
  publishes no developer portal, no API documentation and no OpenAPI of its own, and its main
  website — a SharePoint deployment — answers HTTP 200 to unknown /.well-known/ paths, so a
  presence check there proves nothing. What it does operate, verified by probe on 2026-09-01, is
  two self-hosted EPrints repositories on its own domain: UTPedia (utpedia.utp.edu.my, theses and
  final-year projects) and UTP Scholarly Publication (scholars.utp.edu.my, staff publications).
  Each serves an open OAI-PMH 2.0 endpoint, an unauthenticated EPrints REST dataset interface, an
  OpenSearch description document and RSS feeds; UTPedia additionally serves per-record JSON. The
  institution runs its own Microsoft Entra ID tenant for single sign-on, whose SAML 2.0 federation
  metadata and OIDC discovery document are public — it is not in eduGAIN or the Malaysian SIFULAN
  federation. UTP is a Crossref member (prefix 10.61762, 405 DOIs) and holds ROR 048g2sh07. Its
  learning platforms (Moodle via Pukunui at ulearn, OpenLearning at ulearnplus), its Digital
  Commons journal archive at journal.utp.edu.my and its MyJMS journals are vendor-operated
  tenancies recorded here as relationships, not as UTP engineering. No course catalog, timetable,
  open-data portal or research-computing API was found on any public host.
