      - type: Documentation
        url: https://journal.utp.edu.my/do/oai/?verb=Identify
  - aid: universiti-teknologi-petronas:ulearn-moodle
    name: uLearn learning management system (Moodle tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      ulearn.utp.edu.my CNAMEs to ulearn.utp.my.pukunui.net — a Moodle instance hosted by the
      Moodle partner Pukunui under an institution-branded name. The LTI 1.3 signing keys served
      from it are UTP's; the Moodle contract is not.
    description: >-
      UTP's Moodle LMS. The Moodle web-service layer is enabled and answers with a structured
      invalidtoken exception, so it is real but token-gated. The instance acts as an LTI 1.3
      platform and publishes a live JWKS at /mod/lti/certs.php with an authorization endpoint and
      a token endpoint — the only LTI evidence found anywhere in UTP's footprint, and the basis of
      the education-regime lti conformance record.
    humanURL: https://ulearn.utp.edu.my/
    baseURL: https://ulearn.utp.edu.my
    tags: [ Learning Management, Moodle, LTI, Tenant, Education Technology ]
    properties:
      - type: Documentation
        url: https://ulearn.utp.edu.my/mod/lti/certs.php
      - type: Website
        url: https://ulearn.utp.edu.my/
  - aid: universiti-teknologi-petronas:ulearnplus-openlearning
    name: uLearn+ (OpenLearning tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      ulearnplus.utp.edu.my resolves through Azure Front Door to an OpenLearning-branded
      application. Institution-branded host, vendor platform.
    description: >-
      UTP's OpenLearning deployment, used for open and online course delivery alongside Moodle. No
      institution-published machine-readable descriptor was found on the host; the relationship is
      recorded so the surface is not mistaken for UTP engineering, and so it is not re-discovered
      and misattributed on a later pass.
    humanURL: https://ulearnplus.utp.edu.my/
    tags: [ Learning Management, OpenLearning, Tenant, Education Technology ]
    properties:
      - type: Website
        url: https://ulearnplus.utp.edu.my/
