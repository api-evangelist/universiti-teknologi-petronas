    name: UTPedia Institutional Repository (OAI-PMH)
    description: >-
      UTPedia ("UTP Electronic and Digital Intellectual Asset") is the UTP
      institutional repository running EPrints 3.4.7. It exposes a public
      OAI-PMH 2.0 endpoint for harvesting bibliographic metadata of theses,
      dissertations, and other intellectual assets. Supported metadata formats
      include oai_dc, mets, didl, rdf, oai_bibl, and uketd_dc.
