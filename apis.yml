x-coverage:
  state: covered
  reason: covered
  detail: 'Universiti Teknologi PETRONAS operates no general-purpose public API and publishes no developer
    documentation, but it is not empty: two institution-hosted EPrints repositories expose OAI-PMH 2.0,
    an unauthenticated REST dataset interface, OpenSearch and RSS on utp.edu.my hosts, and the institution''s
    own Entra ID tenant publishes SAML 2.0 federation metadata and OIDC discovery. Four education-regime
    domain standards are evidenced — oai-pmh, saml, lti and crossref; shibboleth, orcid and datacite were
    checked and are absent. Everything else that looks like a UTP API is a vendor tenancy (bepress Digital
    Commons, Pukunui-hosted Moodle, OpenLearning, MOHE''s MyJMS) and is recorded as a relationship with
    x-operator tenant, never as UTP''s contract. Two limits on this pass: myjms.mohe.gov.my, which hosts
    UTP''s two Platform journals, refused connections from our probe host, so that tenancy is documented
    from Crossref metadata rather than probed directly; and the institution''s SharePoint site returns
    soft 404s, so no negative conclusion was drawn from status codes alone there.'
  evidence:
  - url: https://utpedia.utp.edu.my/cgi/oai2?verb=Identify
    status: 200
  - url: https://scholars.utp.edu.my/cgi/oai2?verb=Identify
    status: 200
  - url: https://utpedia.utp.edu.my/rest/
    status: 200
  - url: https://login.microsoftonline.com/utp.edu.my/federationmetadata/2007-06/federationmetadata.xml
    status: 200
  - url: https://ulearn.utp.edu.my/mod/lti/certs.php
    status: 200
  - url: https://api.crossref.org/members/39649
    status: 200
  - url: https://www.utp.edu.my/.well-known/apis.json
    status: 200
    note: soft 404 — SharePoint error page containing "File Not Found."
  - url: https://www.utp.edu.my/llms.txt
    status: 404
  - url: https://api.utp.edu.my/
    status: 0
    note: does not resolve
  - url: https://data.utp.edu.my/
    status: 0
    note: does not resolve
  - url: https://myjms.mohe.gov.my/index.php/pjst/oai?verb=Identify
    status: 0
    note: connection refused from our probe host; MOHE-operated, not UTP
apis:
- aid: universiti-teknologi-petronas:entra-federation
  name: UTP Identity Federation (Microsoft Entra ID tenant)
  x-operator: federation
  x-operator-evidence: getuserrealm.srf reports utp.edu.my as a Managed namespace with FederationBrandName
    "Universiti Teknologi PETRONAS"; the tenant is 84187be3-037e-41ec-889c-a150fe476432 and the SAML entityID
    https://sts.windows.net/84187be3-037e-41ec-889c-a150fe476432/ is the institution's own identity provider.
    Shared host, institution-operated IdP.
  description: UTP federates identity through its own Microsoft Entra ID tenant rather than a Shibboleth
    IdP. Both the SAML 2.0 federation metadata (IDPSSODescriptor, HTTP-POST and HTTP-Redirect SingleSignOnService
    bindings) and the OpenID Connect discovery document are public and machine-readable. The institution
    does not appear in eduGAIN — zero of 13,203 entities carry utp.edu.my — nor among the 163 entities
    the Malaysian SIFULAN federation exports.
  humanURL: https://ucs.utp.edu.my/SignIn
  baseURL: https://login.microsoftonline.com/utp.edu.my
