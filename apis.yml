  - aid: universiti-teknologi-petronas:scholars
    name: UTP Scholarly Publication Repository
    x-operator: institution
    x-operator-evidence: >-
      scholars.utp.edu.my CNAMEs to eprints.utp.edu.my (203.135.191.25); both names are the
      institution's own and the deployment is self-hosted. OAI-PMH Identify names the repository
      "UTP Scholarly Publication" with repositoryIdentifier scholars.utp.edu.my.
    description: >-
      The second EPrints repository UTP runs, holding staff publication records back to 2010. Open
      OAI-PMH 2.0, an unauthenticated EPrints REST interface, a search endpoint with selectable
      serialisations (Atom, BibTeX, ContextObject, DC, EndNote, Ids) advertised through an
      OpenSearch 1.1 description document, and an RSS 2.0 feed. Per-record JSON export is gated
      behind HTTP Basic on this deployment, unlike UTPedia.
    humanURL: https://scholars.utp.edu.my/
    baseURL: https://scholars.utp.edu.my
    tags: [ Institutional Repository, OAI-PMH, EPrints, OpenSearch, Open Access, Research ]
    properties:
      - type: OpenAPI
        url: openapi/universiti-teknologi-petronas-scholars-openapi.yml
      - type: Documentation
        url: https://scholars.utp.edu.my/cgi/oai2?verb=Identify
      - type: Website
        url: https://scholars.utp.edu.my/
  - aid: universiti-teknologi-petronas:entra-federation
    name: UTP Identity Federation (Microsoft Entra ID tenant)
    x-operator: federation
    x-operator-evidence: >-
      getuserrealm.srf reports utp.edu.my as a Managed namespace with FederationBrandName
      "Universiti Teknologi PETRONAS"; the tenant is 84187be3-037e-41ec-889c-a150fe476432 and the
      SAML entityID https://sts.windows.net/84187be3-037e-41ec-889c-a150fe476432/ is the
      institution's own identity provider. Shared host, institution-operated IdP.
    description: >-
      UTP federates identity through its own Microsoft Entra ID tenant rather than a Shibboleth
      IdP. Both the SAML 2.0 federation metadata (IDPSSODescriptor, HTTP-POST and HTTP-Redirect
      SingleSignOnService bindings) and the OpenID Connect discovery document are public and
      machine-readable. The institution does not appear in eduGAIN — zero of 13,203 entities carry
      utp.edu.my — nor among the 163 entities the Malaysian SIFULAN federation exports.
    humanURL: https://ucs.utp.edu.my/SignIn
    baseURL: https://login.microsoftonline.com/utp.edu.my
    tags: [ Identity Federation, SAML, OpenID Connect, Single Sign-On, Entra ID ]
    properties:
      - type: IdentityFederation
        url: https://login.microsoftonline.com/utp.edu.my/federationmetadata/2007-06/federationmetadata.xml
      - type: Documentation
        url: https://login.microsoftonline.com/utp.edu.my/v2.0/.well-known/openid-configuration
  - aid: universiti-teknologi-petronas:crossref-membership
    name: Crossref membership (DOI prefix 10.61762)
    x-operator: registry
    x-operator-evidence: >-
      api.crossref.org is a registry UTP is registered in, not a vendor contract. Member 39649
      "Universiti Teknologi PETRONAS", Seri Iskandar, Perak, Malaysia.
    description: >-
      UTP registers DOIs with Crossref under its own prefix 10.61762 — 405 DOIs (113 current, 292
      backfile) across "Platform: A Journal of Science and Technology" and "Platform: A Journal of
      Management and Humanities", published by UTP Press. The membership is the institution's; the
      API is Crossref's and is not saved here.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/39649
    tags: [ Crossref, DOI, Scholarly Publishing, Registry ]
    properties:
      - type: Documentation
        url: https://api.crossref.org/members/39649
  - aid: universiti-teknologi-petronas:ror
    name: ROR registration (048g2sh07)
    x-operator: registry
    x-operator-evidence: >-
      ROR is an identifier registry the institution is registered in. Record 048g2sh07, domain
      utp.edu.my, established 1997, ISNI 0000 0004 0634 0540, GRID grid.444487.f, Crossref Funder
      IDs 501100005710 / 501100006481 / 501100010658.
    description: >-
      The institution's Research Organization Registry record — the canonical machine-readable
      identity used by DOI metadata, funder systems and repository software to disambiguate UTP.
      The registry's own API is not saved here; the registration is the fact about UTP.
    humanURL: https://ror.org/048g2sh07
    baseURL: https://api.ror.org/organizations/048g2sh07
    tags: [ ROR, Persistent Identifier, Registry, Research ]
    properties:
