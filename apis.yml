- aid: universiti-teknologi-petronas:ulearn-moodle
  name: uLearn learning management system (Moodle tenancy)
  x-operator: tenant
  x-operator-evidence: ulearn.utp.edu.my CNAMEs to ulearn.utp.my.pukunui.net — a Moodle instance hosted
    by the Moodle partner Pukunui under an institution-branded name. The LTI 1.3 signing keys served from
    it are UTP's; the Moodle contract is not.
  description: UTP's Moodle LMS. The Moodle web-service layer is enabled and answers with a structured
    invalidtoken exception, so it is real but token-gated. The instance acts as an LTI 1.3 platform and
    publishes a live JWKS at /mod/lti/certs.php with an authorization endpoint and a token endpoint —
    the only LTI evidence found anywhere in UTP's footprint, and the basis of the education-regime lti
    conformance record.
  humanURL: https://ulearn.utp.edu.my/
  baseURL: https://ulearn.utp.edu.my
