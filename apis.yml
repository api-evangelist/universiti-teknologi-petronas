  detail: >-
    Universiti Teknologi PETRONAS operates no general-purpose public API and publishes no developer
    documentation, but it is not empty: two institution-hosted EPrints repositories expose OAI-PMH
    2.0, an unauthenticated REST dataset interface, OpenSearch and RSS on utp.edu.my hosts, and the
    institution's own Entra ID tenant publishes SAML 2.0 federation metadata and OIDC discovery.
    Four education-regime domain standards are evidenced — oai-pmh, saml, lti and crossref;
    shibboleth, orcid and datacite were checked and are absent. Everything else that looks like a
    UTP API is a vendor tenancy (bepress Digital Commons, Pukunui-hosted Moodle, OpenLearning,
    MOHE's MyJMS) and is recorded as a relationship with x-operator tenant, never as UTP's
    contract. Two limits on this pass: myjms.mohe.gov.my, which hosts UTP's two Platform journals,
    refused connections from our probe host, so that tenancy is documented from Crossref metadata
    rather than probed directly; and the institution's SharePoint site returns soft 404s, so no
    negative conclusion was drawn from status codes alone there.
