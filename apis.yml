aid: universiti-teknologi-petronas
name: Universiti Teknologi PETRONAS
description: >-
  Universiti Teknologi PETRONAS (UTP) is a leading private research university in
  Seri Iskandar, Perak, Malaysia, established in 1997 and wholly owned by the
  national oil company PETRONAS. It is ranked #270 in the QS World University
  Rankings 2025 and offers engineering, science, technology, and business
  programmes. UTP does not publish a dedicated developer portal; its primary
  programmatic surface confirmed to be public is the UTPedia institutional
  repository, which exposes an EPrints OAI-PMH 2.0 endpoint for metadata
  harvesting. Most other systems (single sign-on, student portal, admissions)
  are authentication-gated and not publicly documented as APIs.
